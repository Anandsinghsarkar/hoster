services:
  - type: web
    name: cyberhost-premium
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATA_DIR
        value: /tmp/cyberhost-data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
