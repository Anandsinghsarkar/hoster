<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit bot file</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main style="max-width:1000px;margin:24px auto;padding:16px"><header class="page-heading"><div><div class="eyebrow">ADMIN FILE MANAGER</div><h1>{{ bot['name'] }}<span>.</span></h1><p>{{ area|title }} / {{ path }}</p></div><a class="btn btn-outline" href="/admin/file-manager?bot_id={{ bot['id'] }}">← Back</a></header><section class="panel"><p class="muted">Text files up to 1 MB can be edited. Session, secret, token and credential-like files are blocked. Restart the bot to load runtime changes.</p><form method="post" class="form-grid"><input type="hidden" name="area" value="{{ area }}"><input type="hidden" name="path" value="{{ path }}"><textarea name="content" rows="28" spellcheck="false" style="font-family:monospace;white-space:pre;overflow:auto">{{ content }}</textarea><button class="btn btn-primary">Save File</button></form></section></main></body></html>
